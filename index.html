<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a73e8">
  <title>Pointage Employés</title>
  <style>
    :root {
      --primary: #1a73e8;
      --success: #0d904f;
      --warning: #f9ab00;
      --danger: #d93025;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.45;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 12px; color: var(--primary); }
    h2 { font-size: 1.05rem; margin-bottom: 12px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
    }
    .hidden { display: none !important; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    input, select {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      -webkit-user-select: none;
      user-select: none;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.4; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #202124; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 2px solid var(--primary); color: var(--primary); }
    .btn-small { width: auto; padding: 10px 14px; font-size: 0.85rem; margin: 0 4px 4px 0; display: inline-block; }
    .nav { display: flex; gap: 8px; margin-bottom: 12px; }
    .nav button { flex: 1; margin-bottom: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button { flex: 1; margin-bottom: 0; padding: 12px 6px; font-size: 0.9rem; }
    .employee-info {
      background: #e8f0fe; border-radius: 12px; padding: 14px;
      margin-bottom: 12px; text-align: center;
    }
    .employee-info strong { color: var(--primary); font-size: 1.1rem; }
    .status-box {
      text-align: center; padding: 16px; border-radius: 12px;
      margin-bottom: 12px; font-weight: 700; font-size: 1.05rem;
    }
    .status-in { background: #e6f4ea; color: var(--success); }
    .status-pause { background: #fef7e0; color: #b06000; }
    .status-out { background: #fce8e6; color: var(--danger); }
    .actions { display: grid; gap: 10px; }
    .log-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem;
    }
    .log-item:last-child { border-bottom: none; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 0.8rem; font-weight: 600;
    }
    .badge-in { background: #e6f4ea; color: var(--success); }
    .badge-pause { background: #fef7e0; color: #b06000; }
    .badge-out { background: #fce8e6; color: var(--danger); }
    .badge-fin-pause { background: #e8f0fe; color: var(--primary); }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 8px 3px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .total-row { font-weight: 700; background: #e8f0fe; }
    .msg {
      padding: 12px; border-radius: 10px; margin-bottom: 12px;
      font-size: 0.95rem; text-align: center; font-weight: 500;
    }
    .msg-ok { background: #e6f4ea; color: var(--success); }
    .msg-err { background: #fce8e6; color: var(--danger); }
    .footer { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 16px; padding-bottom: 24px; }
    .worker-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border); gap: 8px;
    }
    .worker-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏱️ Pointage Employés</h1>

    <div class="nav">
      <button type="button" class="btn-primary" id="btnNavEmp">Employé</button>
      <button type="button" class="btn-outline" id="btnNavAdmin">Admin</button>
    </div>

    <div id="message" class="msg hidden"></div>

    <div id="screen-employee">
      <div class="card">
        <h2>Connexion employé</h2>
        <label for="empCode">Code ou nom de l'employé</label>
        <input type="text" id="empCode" placeholder="Ex: EMP001 ou Ahmed" autocomplete="off">
        <button type="button" class="btn-primary" id="btnLoginEmp">Valider</button>
      </div>
    </div>

    <div id="screen-pointage" class="hidden">
      <div class="employee-info" id="empInfo"></div>
      <div id="currentStatus" class="status-box status-out">Statut : Hors service</div>
      <div class="card">
        <h2>Actions</h2>
        <div class="actions">
          <button type="button" class="btn-success" id="btnEntree">🟢 Entrée</button>
          <button type="button" class="btn-warning" id="btnDebutPause">🟡 Début de pause</button>
          <button type="button" class="btn-outline" id="btnFinPause">🔵 Fin de pause</button>
          <button type="button" class="btn-danger" id="btnSortie">🔴 Sortie</button>
        </div>
      </div>
      <div class="card">
        <h2>Aujourd'hui</h2>
        <div id="todayLogs"></div>
      </div>
      <button type="button" class="btn-outline" id="btnLogoutEmp">Changer d'employé</button>
    </div>

    <div id="screen-adminLogin" class="hidden">
      <div class="card">
        <h2>Connexion administrateur</h2>
        <label for="adminUser">Nom d'utilisateur</label>
        <input type="text" id="adminUser" placeholder="admin" autocomplete="username">
        <label for="adminPass">Mot de passe</label>
        <input type="password" id="adminPass" placeholder="Mot de passe" autocomplete="current-password">
        <button type="button" class="btn-primary" id="btnLoginAdmin">Connexion</button>
        <p style="font-size:0.8rem;color:var(--muted);margin-top:8px;text-align:center;">Identifiants : <strong>admin</strong> / <strong>admin123</strong></p>
      </div>
    </div>

    <div id="screen-admin" class="hidden">
      <div class="tabs" id="adminTabs">
        <button type="button" class="btn-primary" data-tab="workers">Employés</button>
        <button type="button" class="btn-outline" data-tab="report">Rapport</button>
        <button type="button" class="btn-outline" data-tab="settings">Réglages</button>
      </div>

      <div id="admin-workers">
        <div class="card">
          <h2>Ajouter un employé</h2>
          <label>Code (unique)</label>
          <input type="text" id="newCode" placeholder="EMP001" autocapitalize="characters">
          <label>Nom complet</label>
          <input type="text" id="newName" placeholder="Jean Dupont">
          <label>Métier / Profession</label>
          <input type="text" id="newJob" placeholder="Maçon">
          <label>Téléphone</label>
          <input type="tel" id="newPhone" placeholder="06 12 34 56 78">
          <label>Adresse</label>
          <input type="text" id="newAdresse" placeholder="123 rue Example, Montréal">
          <label>Salaire / heure ($)</label>
          <input type="number" id="newSalaire" placeholder="25.00" step="0.01" min="0" inputmode="decimal">
          <button type="button" class="btn-success" id="btnAddWorker">Ajouter</button>
        </div>
        <div class="card">
          <h2>Liste des employés</h2>
          <div id="workersList"></div>
        </div>
      </div>

      <div id="admin-report" class="hidden">
        <div class="card">
          <h2>Rapport hebdomadaire</h2>
          <label>Employé</label>
          <select id="reportWorker"></select>
          <label>Date dans la semaine</label>
          <input type="date" id="reportWeek">
          <button type="button" class="btn-primary" id="btnGenerateReport">Générer le rapport</button>
        </div>
        <div class="card hidden" id="reportResult">
          <h2 id="reportTitle"></h2>
          <div id="reportContent"></div>
        </div>
      </div>

      <div id="admin-settings" class="hidden">
        <div class="card">
          <h2>Rapport PDF</h2>
          <label>Employé</label>
          <select id="pdfWorker"></select>
          <label>Date dans la semaine</label>
          <input type="date" id="pdfWeek">
          <button type="button" class="btn-primary" id="btnExportPdf">Exporter rapport PDF</button>
        </div>
        <div class="card">
          <h2>Données</h2>
          <button type="button" class="btn-danger" id="btnClearData">Effacer toutes les données</button>
        </div>
        <button type="button" class="btn-outline" id="btnLogoutAdmin">Déconnexion admin</button>
      </div>
    </div>

    <div class="footer">Pointage Employés • Données locales sur cet appareil</div>
  </div>

  <script>
(function () {
  'use strict';

  var KEY_W = 'pt_workers_v2';
  var KEY_P = 'pt_punches_v2';

  function getWorkers() {
    try { return JSON.parse(localStorage.getItem(KEY_W) || '[]'); } catch (e) { return []; }
  }
  function saveWorkers(w) { localStorage.setItem(KEY_W, JSON.stringify(w)); }
  function getPunches() {
    try { return JSON.parse(localStorage.getItem(KEY_P) || '[]'); } catch (e) { return []; }
  }
  function savePunches(p) { localStorage.setItem(KEY_P, JSON.stringify(p)); }

  var currentEmployee = null;

  function $(id) { return document.getElementById(id); }

  function showMessage(text, isError) {
    var el = $('message');
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'msg-err' : 'msg-ok');
    el.classList.remove('hidden');
    clearTimeout(showMessage._t);
    showMessage._t = setTimeout(function () { el.classList.add('hidden'); }, 3500);
  }

  var adminLoggedIn = false;

  function showScreen(name) {
    ['employee', 'pointage', 'adminLogin', 'admin'].forEach(function (s) {
      var el = $('screen-' + s);
      if (el) el.classList.add('hidden');
    });
    var target = $('screen-' + name);
    if (target) target.classList.remove('hidden');
    if (name === 'admin') {
      adminLoggedIn = true;
      showAdminTab('workers');
      renderWorkersList();
      fillReportWorkers();
      fillPdfWorkers();
    }
  }

  function showAdminTab(tab) {
    ['workers', 'report', 'settings'].forEach(function (t) {
      var el = $('admin-' + t);
      if (el) el.classList.add('hidden');
    });
    var target = $('admin-' + tab);
    if (target) target.classList.remove('hidden');
    var btns = document.querySelectorAll('#adminTabs button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (btns[i].getAttribute('data-tab') === tab) ? 'btn-primary' : 'btn-outline';
    }
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function formatTime(iso) {
    return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function getTodayPunches(code) {
    var today = todayStr();
    return getPunches()
      .filter(function (p) { return p.code === code && p.date === today; })
      .sort(function (a, b) { return new Date(a.time) - new Date(b.time); });
  }

  function getLastAction(code) {
    var list = getTodayPunches(code);
    return list.length ? list[list.length - 1].action : null;
  }

  function loginEmployee() {
    var q = $('empCode').value.trim();
    if (!q) { showMessage('Entrez le code ou le nom', true); return; }
    var workers = getWorkers();
    var emp = null;
    var qUp = q.toUpperCase();
    var qLow = q.toLowerCase();
    // 1) Correspondance exacte du code
    for (var i = 0; i < workers.length; i++) {
      if (workers[i].code === qUp) { emp = workers[i]; break; }
    }
    // 2) Correspondance exacte du nom (sans tenir compte de la casse)
    if (!emp) {
      for (var i = 0; i < workers.length; i++) {
        if ((workers[i].name || '').toLowerCase() === qLow) { emp = workers[i]; break; }
      }
    }
    // 3) Nom qui contient le texte saisi (ex: "Ahmed" trouve "Ahmed Benali")
    if (!emp) {
      var matches = [];
      for (var i = 0; i < workers.length; i++) {
        if ((workers[i].name || '').toLowerCase().indexOf(qLow) !== -1) matches.push(workers[i]);
      }
      if (matches.length === 1) emp = matches[0];
      else if (matches.length > 1) {
        showMessage('Plusieurs employés trouvés. Précisez le nom ou utilisez le code.', true);
        return;
      }
    }
    if (!emp) { showMessage('Employé introuvable (code ou nom)', true); return; }
    currentEmployee = emp;
    $('empInfo').innerHTML = '<strong>' + emp.name + '</strong><br>' +
      (emp.job || '—') + ' • ' + (emp.phone || '—') +
      '<br><small>Code : ' + emp.code + '</small>';
    updateStatusAndLogs();
    showScreen('pointage');
    $('empCode').value = '';
  }

  function updateStatusAndLogs() {
    if (!currentEmployee) return;
    var last = getLastAction(currentEmployee.code);
    var statusEl = $('currentStatus');
    var labels = { entree: 'En service', debut_pause: 'En pause', fin_pause: 'En service', sortie: 'Hors service' };
    var classes = { entree: 'status-in', debut_pause: 'status-pause', fin_pause: 'status-in', sortie: 'status-out' };
    statusEl.textContent = 'Statut : ' + (labels[last] || 'Hors service');
    statusEl.className = 'status-box ' + (classes[last] || 'status-out');

    var btnE = $('btnEntree'), btnDP = $('btnDebutPause'), btnFP = $('btnFinPause'), btnS = $('btnSortie');
    btnE.disabled = false; btnDP.disabled = false; btnFP.disabled = false; btnS.disabled = false;
    if (!last || last === 'sortie') {
      btnDP.disabled = true; btnFP.disabled = true; btnS.disabled = true;
    } else if (last === 'entree' || last === 'fin_pause') {
      btnE.disabled = true; btnFP.disabled = true;
    } else if (last === 'debut_pause') {
      btnE.disabled = true; btnDP.disabled = true; btnS.disabled = true;
    }

    var logs = getTodayPunches(currentEmployee.code);
    var container = $('todayLogs');
    if (!logs.length) {
      container.innerHTML = '<p style="color:var(--muted);text-align:center;">Aucun pointage aujourd\'hui</p>';
      return;
    }
    var badgeClass = { entree: 'badge-in', debut_pause: 'badge-pause', fin_pause: 'badge-fin-pause', sortie: 'badge-out' };
    var badgeLabel = { entree: 'Entrée', debut_pause: 'Début pause', fin_pause: 'Fin pause', sortie: 'Sortie' };
    var html = '';
    for (var i = 0; i < logs.length; i++) {
      html += '<div class="log-item"><span class="badge ' + badgeClass[logs[i].action] + '">' +
        badgeLabel[logs[i].action] + '</span><span>' + formatTime(logs[i].time) + '</span></div>';
    }
    container.innerHTML = html;
  }

  function doAction(action) {
    if (!currentEmployee) return;
    var last = getLastAction(currentEmployee.code);
    var allowed = {
      entree: [null, 'sortie'],
      debut_pause: ['entree', 'fin_pause'],
      fin_pause: ['debut_pause'],
      sortie: ['entree', 'fin_pause']
    };
    if (allowed[action].indexOf(last) === -1) {
      showMessage('Action non autorisée', true);
      return;
    }
    var now = new Date();
    var punches = getPunches();
    punches.push({
      id: Date.now().toString(36),
      code: currentEmployee.code,
      action: action,
      time: now.toISOString(),
      date: todayStr()
    });
    savePunches(punches);
    var labels = { entree: 'Entrée', debut_pause: 'Début de pause', fin_pause: 'Fin de pause', sortie: 'Sortie' };
    showMessage(labels[action] + ' à ' + formatTime(now.toISOString()));
    updateStatusAndLogs();
  }

  function addWorker() {
    var code = $('newCode').value.trim().toUpperCase();
    var name = $('newName').value.trim();
    var job = $('newJob').value.trim();
    var phone = $('newPhone').value.trim();
    var adresse = $('newAdresse').value.trim();
    var salaire = parseFloat($('newSalaire').value);
    if (isNaN(salaire) || salaire < 0) salaire = 0;
    if (!code || !name) { showMessage('Code et nom obligatoires', true); return; }
    var workers = getWorkers();
    for (var i = 0; i < workers.length; i++) {
      if (workers[i].code === code) { showMessage('Code déjà utilisé', true); return; }
    }
    workers.push({ code: code, name: name, job: job, phone: phone, adresse: adresse, salaire: salaire });
    saveWorkers(workers);
    $('newCode').value = ''; $('newName').value = ''; $('newJob').value = ''; $('newPhone').value = '';
    $('newAdresse').value = ''; $('newSalaire').value = '';
    showMessage('Employé ajouté');
    renderWorkersList();
    fillReportWorkers();
    fillPdfWorkers();
  }

  function deleteWorker(code) {
    if (!confirm('Supprimer cet employé ?')) return;
    saveWorkers(getWorkers().filter(function (w) { return w.code !== code; }));
    savePunches(getPunches().filter(function (p) { return p.code !== code; }));
    showMessage('Supprimé');
    renderWorkersList();
    fillReportWorkers();
  }

  function renderWorkersList() {
    var workers = getWorkers();
    var el = $('workersList');
    if (!workers.length) {
      el.innerHTML = '<p style="color:var(--muted);text-align:center;">Aucun employé</p>';
      return;
    }
    var html = '';
    for (var i = 0; i < workers.length; i++) {
      var w = workers[i];
      var salStr = (w.salaire && w.salaire > 0) ? (Number(w.salaire).toFixed(2) + ' $/h') : '—';
      html += '<div class="worker-row"><div><strong>' + w.name + '</strong><br><small>' +
        w.code + ' • ' + (w.job || '—') + ' • ' + (w.phone || '—') +
        '<br>' + (w.adresse || '—') + ' • ' + salStr +
        '</small></div><button type="button" class="btn-danger btn-small del-btn" data-code="' +
        w.code + '">Suppr.</button></div>';
    }
    el.innerHTML = html;
    var btns = el.querySelectorAll('.del-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].onclick = function () { deleteWorker(this.getAttribute('data-code')); };
    }
  }

  function fillReportWorkers() {
    var workers = getWorkers();
    var html = '';
    for (var i = 0; i < workers.length; i++) {
      html += '<option value="' + workers[i].code + '">' + workers[i].name + ' (' + workers[i].code + ')</option>';
    }
    $('reportWorker').innerHTML = html;
  }

  function getMonday(dateStr) {
    var date = new Date(dateStr + 'T12:00:00');
    var day = date.getDay();
    var diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    return date;
  }

  function generateReport() {
    var code = $('reportWorker').value;
    var weekInput = $('reportWeek').value;
    if (!code || !weekInput) { showMessage('Choisissez employé et date', true); return; }
    var workers = getWorkers();
    var emp = null;
    for (var i = 0; i < workers.length; i++) {
      if (workers[i].code === code) { emp = workers[i]; break; }
    }
    if (!emp) return;

    var monday = getMonday(weekInput);
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }

    var allPunches = getPunches().filter(function (p) {
      return p.code === code && days.indexOf(p.date) !== -1;
    });
    var totalMinutes = 0;
    var dayNames = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
    var rate = parseFloat(emp.salaire) || 0;
    var html = '<p><strong>' + emp.name + '</strong> — ' + (emp.job || '') +
      '<br>' + (emp.adresse ? emp.adresse + '<br>' : '') +
      (rate > 0 ? 'Salaire : ' + rate.toFixed(2) + ' $/h<br>' : '') +
      'Semaine du ' + monday.toLocaleDateString('fr-FR') + ' au ' +
      new Date(days[6] + 'T12:00:00').toLocaleDateString('fr-FR') +
      '</p><table><thead><tr><th>Jour</th><th>Entrée</th><th>Sortie</th><th>Pauses</th><th>Heures</th></tr></thead><tbody>';

    for (var idx = 0; idx < 7; idx++) {
      var day = days[idx];
      var dayPunches = allPunches.filter(function (p) { return p.date === day; })
        .sort(function (a, b) { return new Date(a.time) - new Date(b.time); });
      var entree = null, sortie = null, pauseMinutes = 0, pauseStart = null, pauseText = [];
      for (var k = 0; k < dayPunches.length; k++) {
        var p = dayPunches[k];
        if (p.action === 'entree') entree = p.time;
        if (p.action === 'sortie') sortie = p.time;
        if (p.action === 'debut_pause') pauseStart = p.time;
        if (p.action === 'fin_pause' && pauseStart) {
          pauseMinutes += (new Date(p.time) - new Date(pauseStart)) / 60000;
          pauseText.push(formatTime(pauseStart) + '-' + formatTime(p.time));
          pauseStart = null;
        }
      }
      var workMinutes = 0;
      if (entree && sortie) {
        workMinutes = (new Date(sortie) - new Date(entree)) / 60000 - pauseMinutes;
        if (workMinutes < 0) workMinutes = 0;
        totalMinutes += workMinutes;
      }
      var hoursStr = workMinutes > 0
        ? Math.floor(workMinutes / 60) + 'h ' + String(Math.round(workMinutes % 60)).padStart(2, '0') + 'm'
        : '—';
      html += '<tr><td>' + dayNames[idx] + '<br><small>' + day.slice(8) + '/' + day.slice(5, 7) +
        '</small></td><td>' + (entree ? formatTime(entree) : '—') + '</td><td>' +
        (sortie ? formatTime(sortie) : '—') + '</td><td>' +
        (pauseText.length ? pauseText.join(', ') : '—') + '</td><td>' + hoursStr + '</td></tr>';
    }
    var totalH = Math.floor(totalMinutes / 60);
    var totalM = Math.round(totalMinutes % 60);
    var totalHoursDec = totalMinutes / 60;
    var totalPay = totalHoursDec * rate;
    html += '<tr class="total-row"><td colspan="4">TOTAL SEMAINE</td><td>' +
      totalH + 'h ' + String(totalM).padStart(2, '0') + 'm</td></tr>';
    if (rate > 0) {
      html += '<tr class="total-row"><td colspan="4">TOTAL PAIEMENT (' + rate.toFixed(2) + ' $/h)</td><td>' +
        totalPay.toFixed(2) + ' $</td></tr>';
    } else {
      html += '<tr class="total-row"><td colspan="4">TOTAL PAIEMENT</td><td>—</td></tr>';
    }
    html += '</tbody></table>';
    $('reportTitle').textContent = 'Rapport — ' + emp.name;
    $('reportContent').innerHTML = html;
    $('reportResult').classList.remove('hidden');
  }

  function loginAdmin() {
    var user = ($('adminUser').value || '').trim().toLowerCase();
    var pass = $('adminPass').value || '';
    if (user === 'admin' && pass === 'admin123') {
      $('adminUser').value = '';
      $('adminPass').value = '';
      showScreen('admin');
      showMessage('Connecté en tant qu\'administrateur');
    } else {
      showMessage('Identifiant ou mot de passe incorrect', true);
    }
  }

  function logoutAdmin() {
    adminLoggedIn = false;
    showScreen('employee');
  }

  function fillPdfWorkers() {
    var workers = getWorkers();
    var html = '';
    for (var i = 0; i < workers.length; i++) {
      html += '<option value="' + workers[i].code + '">' + workers[i].name + ' (' + workers[i].code + ')</option>';
    }
    var sel = $('pdfWorker');
    if (sel) sel.innerHTML = html;
  }

  function buildWeekReportHtml(code, weekInput) {
    var workers = getWorkers();
    var emp = null;
    for (var i = 0; i < workers.length; i++) {
      if (workers[i].code === code) { emp = workers[i]; break; }
    }
    if (!emp) return null;

    var monday = getMonday(weekInput);
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }

    var allPunches = getPunches().filter(function (p) {
      return p.code === code && days.indexOf(p.date) !== -1;
    });
    var totalMinutes = 0;
    var dayNames = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
    var rows = '';

    for (var idx = 0; idx < 7; idx++) {
      var day = days[idx];
      var dayPunches = allPunches.filter(function (p) { return p.date === day; })
        .sort(function (a, b) { return new Date(a.time) - new Date(b.time); });
      var entree = null, sortie = null, pauseMinutes = 0, pauseStart = null, pauseText = [];
      for (var k = 0; k < dayPunches.length; k++) {
        var p = dayPunches[k];
        if (p.action === 'entree') entree = p.time;
        if (p.action === 'sortie') sortie = p.time;
        if (p.action === 'debut_pause') pauseStart = p.time;
        if (p.action === 'fin_pause' && pauseStart) {
          pauseMinutes += (new Date(p.time) - new Date(pauseStart)) / 60000;
          pauseText.push(formatTime(pauseStart) + '-' + formatTime(p.time));
          pauseStart = null;
        }
      }
      var workMinutes = 0;
      if (entree && sortie) {
        workMinutes = (new Date(sortie) - new Date(entree)) / 60000 - pauseMinutes;
        if (workMinutes < 0) workMinutes = 0;
        totalMinutes += workMinutes;
      }
      var hoursStr = workMinutes > 0
        ? Math.floor(workMinutes / 60) + 'h ' + String(Math.round(workMinutes % 60)).padStart(2, '0') + 'm'
        : '—';
      rows += '<tr><td>' + dayNames[idx] + ' ' + day.slice(8) + '/' + day.slice(5, 7) +
        '</td><td>' + (entree ? formatTime(entree) : '—') + '</td><td>' +
        (sortie ? formatTime(sortie) : '—') + '</td><td>' +
        (pauseText.length ? pauseText.join(', ') : '—') + '</td><td>' + hoursStr + '</td></tr>';
    }
    var totalH = Math.floor(totalMinutes / 60);
    var totalM = Math.round(totalMinutes % 60);
    var rate = parseFloat(emp.salaire) || 0;
    var totalPay = (totalMinutes / 60) * rate;
    var title = 'Rapport de pointage — ' + emp.name;
    var period = 'Semaine du ' + monday.toLocaleDateString('fr-FR') + ' au ' +
      new Date(days[6] + 'T12:00:00').toLocaleDateString('fr-FR');
    var payRow = rate > 0
      ? '<tr style="font-weight:bold;background:#e6f4ea;"><td colspan="4" style="border:1px solid #ccc;padding:8px;">TOTAL PAIEMENT (' + rate.toFixed(2) + ' $/h)</td>' +
        '<td style="border:1px solid #ccc;padding:8px;">' + totalPay.toFixed(2) + ' $</td></tr>'
      : '<tr style="font-weight:bold;background:#e6f4ea;"><td colspan="4" style="border:1px solid #ccc;padding:8px;">TOTAL PAIEMENT</td>' +
        '<td style="border:1px solid #ccc;padding:8px;">—</td></tr>';

    return {
      title: title,
      html: '<div style="font-family:Arial,sans-serif;padding:20px;max-width:800px;margin:0 auto;">' +
        '<h1 style="color:#1a73e8;font-size:20px;">' + title + '</h1>' +
        '<p><strong>Métier :</strong> ' + (emp.job || '—') + ' &nbsp;|&nbsp; <strong>Téléphone :</strong> ' + (emp.phone || '—') +
        ' &nbsp;|&nbsp; <strong>Code :</strong> ' + emp.code + '</p>' +
        '<p><strong>Adresse :</strong> ' + (emp.adresse || '—') +
        (rate > 0 ? ' &nbsp;|&nbsp; <strong>Salaire :</strong> ' + rate.toFixed(2) + ' $/h' : '') + '</p>' +
        '<p>' + period + '</p>' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
        '<thead><tr style="background:#e8f0fe;">' +
        '<th style="border:1px solid #ccc;padding:8px;text-align:left;">Jour</th>' +
        '<th style="border:1px solid #ccc;padding:8px;text-align:left;">Entrée</th>' +
        '<th style="border:1px solid #ccc;padding:8px;text-align:left;">Sortie</th>' +
        '<th style="border:1px solid #ccc;padding:8px;text-align:left;">Pauses</th>' +
        '<th style="border:1px solid #ccc;padding:8px;text-align:left;">Heures</th>' +
        '</tr></thead><tbody>' + rows +
        '<tr style="font-weight:bold;background:#e8f0fe;"><td colspan="4" style="border:1px solid #ccc;padding:8px;">TOTAL SEMAINE</td>' +
        '<td style="border:1px solid #ccc;padding:8px;">' + totalH + 'h ' + String(totalM).padStart(2, '0') + 'm</td></tr>' +
        payRow +
        '</tbody></table>' +
        '<p style="margin-top:24px;font-size:12px;color:#666;">Généré le ' + new Date().toLocaleString('fr-FR') +
        ' — Pointage Employés</p></div>'
    };
  }

  function exportPdf() {
    var code = $('pdfWorker').value;
    var weekInput = $('pdfWeek').value;
    if (!code || !weekInput) { showMessage('Choisissez employé et date', true); return; }
    var report = buildWeekReportHtml(code, weekInput);
    if (!report) { showMessage('Employé introuvable', true); return; }

    var w = window.open('', '_blank', 'width=800,height=600');
    if (!w) {
      showMessage('Autorisez les pop-ups pour exporter le PDF', true);
      return;
    }
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + report.title +
      '</title><style>@media print { body { margin: 0; } }</style></head><body>' +
      report.html +
      '<script>window.onload=function(){setTimeout(function(){window.print();},300);}<\/script>' +
      '</body></html>');
    w.document.close();
    showMessage('Fenêtre d\'impression ouverte — choisissez « Enregistrer en PDF »');
  }

  function clearAllData() {
    if (!confirm('Effacer TOUTES les données ?')) return;
    localStorage.removeItem(KEY_W);
    localStorage.removeItem(KEY_P);
    showMessage('Données effacées');
    renderWorkersList();
    fillReportWorkers();
  }

  function init() {
    $('btnNavEmp').onclick = function () {
      showScreen(currentEmployee ? 'pointage' : 'employee');
    };
    $('btnNavAdmin').onclick = function () {
      if (adminLoggedIn) showScreen('admin');
      else showScreen('adminLogin');
    };

    $('btnLoginEmp').onclick = loginEmployee;
    $('empCode').onkeydown = function (e) { if (e.key === 'Enter') loginEmployee(); };
    $('btnLogoutEmp').onclick = function () { currentEmployee = null; showScreen('employee'); };
    $('btnEntree').onclick = function () { doAction('entree'); };
    $('btnDebutPause').onclick = function () { doAction('debut_pause'); };
    $('btnFinPause').onclick = function () { doAction('fin_pause'); };
    $('btnSortie').onclick = function () { doAction('sortie'); };

    $('btnLoginAdmin').onclick = loginAdmin;
    $('adminPass').onkeydown = function (e) { if (e.key === 'Enter') loginAdmin(); };
    $('adminUser').onkeydown = function (e) { if (e.key === 'Enter') $('adminPass').focus(); };

    var tabBtns = document.querySelectorAll('#adminTabs button');
    for (var i = 0; i < tabBtns.length; i++) {
      tabBtns[i].onclick = function () { showAdminTab(this.getAttribute('data-tab')); };
    }
    $('btnAddWorker').onclick = addWorker;
    $('btnGenerateReport').onclick = generateReport;
    $('btnExportPdf').onclick = exportPdf;
    $('btnClearData').onclick = clearAllData;
    $('btnLogoutAdmin').onclick = logoutAdmin;

    $('reportWeek').value = todayStr();
    if ($('pdfWeek')) $('pdfWeek').value = todayStr();

    if (getWorkers().length === 0) {
      saveWorkers([
        { code: 'EMP001', name: 'Ahmed Benali', job: 'Maçon', phone: '06 12 34 56 78', adresse: '10 rue Principale, Montréal', salaire: 28 },
        { code: 'EMP002', name: 'Fatima Zahra', job: 'Peintre', phone: '06 98 76 54 32', adresse: '25 av. des Lilas, Laval', salaire: 26.5 }
      ]);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
